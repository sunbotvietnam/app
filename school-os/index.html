<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sunbot – Phát triển trường</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f6f7f9;color:#1d2530}.boot{min-height:100vh;display:grid;place-items:center;padding:24px}.box{width:min(520px,92vw);background:#fff;border:1px solid #e5e8ed;border-radius:16px;padding:24px;box-shadow:0 12px 30px rgba(26,34,44,.07)}.brand{font-weight:800;font-size:18px}.muted{margin-top:8px;color:#727b87;font-size:13px;line-height:1.5}.err{color:#b83b3b;white-space:pre-wrap}
</style>
</head>
<body>
<div class="boot"><div class="box"><div class="brand">Sunbot – Phát triển trường</div><div class="muted" id="status">Đang tải ứng dụng...</div></div></div>
<script>
(async function(){
  const base='https://raw.githubusercontent.com/sunbotvietnam/app/main/school-os/';
  const files=['state-bridge.js','app-config.js','backend-adapter.js','multiuser-runtime.js','account-security-runtime.js','team-hierarchy-runtime.js','governance-runtime.js','governance-deploy-guard.js','record-editor-runtime.js','business-polish-runtime.js','ui-guide-runtime.js','language-vi-runtime.js','email-intelligence-runtime.js','deep-engagement-runtime.js'];
  try{
    const responses=await Promise.all([fetch(base+'v3.html?ts='+Date.now(),{cache:'no-store'}),...files.map(f=>fetch(base+f+'?ts='+Date.now(),{cache:'no-store'}))]);
    for(const r of responses) if(!r.ok) throw new Error('Không tải được '+r.url+' — HTTP '+r.status);
    const texts=await Promise.all(responses.map(r=>r.text()));
    let html=texts[0];
    const urls=texts.slice(1).map(js=>URL.createObjectURL(new Blob([js],{type:'text/javascript'})));
    const tags=urls.map(u=>'<scr'+'ipt src="'+u+'"></scr'+'ipt>').join('');
    html=html.replace('</body>',tags+'</body>');
    document.open();document.write(html);document.close();
  }catch(e){
    const s=document.getElementById('status');
    if(s){s.className='muted err';s.textContent='Không mở được ứng dụng.\n'+String(e&&e.message||e);}
  }
})();
</script>
</body>
</html>
