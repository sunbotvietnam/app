<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sunbot School OS</title>
<style>body{font-family:system-ui;margin:40px;color:#1d2530}.err{max-width:720px;padding:18px;border:1px solid #e5e8ed;border-radius:14px;background:#fff}</style>
</head>
<body>
<div id="loading">Đang mở Sunbot School OS...</div>
<script>
(async function(){
  try{
    const r=await fetch('v3.html',{cache:'no-store'});
    if(!r.ok)throw new Error('Không tải được ứng dụng: HTTP '+r.status);
    let html=await r.text();
    html=html.replace('</body>','<script src="backend-adapter.js"><\/script><script src="runtime-patch.js"><\/script><script src="multiuser-runtime.js"><\/script></body>');
    document.open();document.write(html);document.close();
  }catch(e){document.getElementById('loading').outerHTML='<div class="err"><b>Không mở được ứng dụng.</b><p>'+String(e.message||e)+'</p></div>';}
})();
</script>
</body>
</html>
