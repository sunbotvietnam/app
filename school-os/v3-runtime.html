<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sunbot – Phát triển trường</title>
<meta name="theme-color" content="#f47a2a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sunbot School">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preload" href="v3.html" as="fetch" crossorigin="anonymous">
<link rel="preload" href="state-bridge.js" as="script">
<link rel="preload" href="app-config.js" as="script">
<link rel="preload" href="backend-adapter.js" as="script">
<link rel="preload" href="multiuser-runtime.js" as="script">
<link rel="preload" href="account-security-runtime.js" as="script">
<link rel="preload" href="team-hierarchy-runtime.js" as="script">
<link rel="preload" href="record-editor-runtime.js" as="script">
<link rel="preload" href="school-field-permissions-runtime.js" as="script">
<link rel="preload" href="business-polish-runtime.js" as="script">
<link rel="preload" href="ui-guide-runtime.js" as="script">
<link rel="preload" href="language-vi-runtime.js" as="script">
<link rel="preload" href="portal-journey-bridge.js" as="script">
<link rel="preload" href="email-intelligence-runtime.js" as="script">
<link rel="preload" href="deep-engagement-runtime.js" as="script">
<link rel="preload" href="governance-runtime.js" as="script">
<link rel="preload" href="governance-deploy-guard.js" as="script">
<link rel="preload" href="pwa-runtime.js" as="script">
<style>body{font-family:system-ui;margin:40px;color:#1d2530}.err{max-width:720px;padding:18px;border:1px solid #e5e8ed;border-radius:14px;background:#fff}</style>
</head>
<body>
<div id="loading">Đang mở ứng dụng Sunbot...</div>
<script>
(async function(){
  try{
    const r=await fetch('v3.html?ts='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('Không tải được ứng dụng: HTTP '+r.status);
    let html=await r.text();
    const ts=Date.now();
    html=html.replace('</head>',
      '<meta name="theme-color" content="#f47a2a">'+
      '<link rel="manifest" href="manifest.webmanifest">'+
      '<link rel="icon" href="icon.svg" type="image/svg+xml">'+
      '<link rel="apple-touch-icon" href="apple-touch-icon.png">'+
      '<meta name="apple-mobile-web-app-capable" content="yes">'+
      '<meta name="apple-mobile-web-app-status-bar-style" content="default">'+
      '<meta name="apple-mobile-web-app-title" content="Sunbot School">'+
      '<meta name="mobile-web-app-capable" content="yes">'+
      '</head>');
    html=html.replace('</body>',
      '<script src="state-bridge.js?ts='+ts+'"><\/script>'+
      '<script src="app-config.js?ts='+ts+'"><\/script>'+
      '<script src="backend-adapter.js?ts='+ts+'"><\/script>'+
      '<script src="multiuser-runtime.js?ts='+ts+'"><\/script>'+
      '<script src="account-security-runtime.js?ts='+ts+'"><\/script>'+
      '<script src="team-hierarchy-runtime.js?ts='+ts+'"><\/script>'+
      '<script src="record-editor-runtime.js?ts='+ts+'"><\/script>'+
      '<script src="school-field-permissions-runtime.js?ts='+ts+'"><\/script>'+
      '<script src="business-polish-runtime.js?ts='+ts+'"><\/script>'+
      '<script src="ui-guide-runtime.js?ts='+ts+'"><\/script>'+
      '<script src="language-vi-runtime.js?ts='+ts+'"><\/script>'+
      '<script src="portal-journey-bridge.js?ts='+ts+'"><\/script>'+
      '<script src="email-intelligence-runtime.js?ts='+ts+'"><\/script>'+
      '<script src="deep-engagement-runtime.js?ts='+ts+'"><\/script>'+
      '<script src="governance-runtime.js?ts='+ts+'"><\/script>'+
      '<script src="governance-deploy-guard.js?ts='+ts+'"><\/script>'+
      '<script src="pwa-runtime.js?ts='+ts+'"><\/script>'+
      '</body>');
    document.open();document.write(html);document.close();
  }catch(e){document.getElementById('loading').outerHTML='<div class="err"><b>Không mở được ứng dụng.</b><p>'+String(e.message||e)+'</p></div>';}
})();
</script>
</body>
</html>
