<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hồ sơ Sunbot</title>
<style>html,body{margin:0;height:100%;background:#fff}#frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}.msg{font-family:system-ui;padding:24px;color:#445}</style>
</head>
<body>
<div id="msg" class="msg">Đang mở hồ sơ Sunbot...</div>
<iframe id="frame" hidden referrerpolicy="no-referrer-when-downgrade"></iframe>
<script>
(function(){
  'use strict';
  const p=new URLSearchParams(location.search), target=p.get('target')||'';
  const beacons={d30:p.get('d30'),s50:p.get('s50'),s90:p.get('s90'),program:p.get('program'),model:p.get('model'),cta:p.get('cta')};
  const fired={};
  function ping(k){const u=beacons[k];if(!u||fired[k])return;fired[k]=true;try{fetch(u,{mode:'no-cors',cache:'no-store',redirect:'follow'}).catch(()=>{});}catch(e){try{const i=new Image();i.src=u;}catch(_){} }}
  function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
  function hasAny(txt,keys){const n=norm(txt);return keys.some(k=>n.includes(k));}
  function attach(doc,win){
    setTimeout(()=>ping('d30'),30000);
    let ticking=false;
    function onScroll(){if(ticking)return;ticking=true;requestAnimationFrame(()=>{ticking=false;const de=doc.documentElement,b=doc.body||de;const top=win.scrollY||de.scrollTop||b.scrollTop||0;const h=Math.max(de.scrollHeight,b.scrollHeight)-win.innerHeight;if(h>0){const r=top/h;if(r>=.5)ping('s50');if(r>=.88)ping('s90');}})}
    win.addEventListener('scroll',onScroll,{passive:true});onScroll();
    const headings=[...doc.querySelectorAll('h1,h2,h3,h4,[role="heading"],section')];
    if('IntersectionObserver' in win){
      const io=new win.IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting||e.intersectionRatio<.35)return;const txt=(e.target.innerText||e.target.textContent||'').slice(0,600);if(hasAny(txt,['chuong trinh','lap trinh','steam','robot']))ping('program');if(hasAny(txt,['mo hinh hop tac','hop tac','trien khai','chuyen giao','phuong an']))ping('model');}),{threshold:[.35]});headings.forEach(x=>io.observe(x));
    }else{
      const all=norm(doc.body?.innerText||'');if(hasAny(all,['chuong trinh','lap trinh','steam']))ping('program');if(hasAny(all,['mo hinh hop tac','hop tac','trien khai']))ping('model');
    }
    doc.addEventListener('click',e=>{const a=e.target.closest?.('a,button,[role="button"]');if(a)ping('cta');},true);
  }
  if(!/^https?:\/\//i.test(target)){document.getElementById('msg').textContent='Không tìm thấy hồ sơ.';return;}
  const f=document.getElementById('frame');f.src=target;f.hidden=false;document.getElementById('msg').hidden=true;
  f.addEventListener('load',()=>{try{const d=f.contentDocument,w=f.contentWindow;if(d&&w)attach(d,w);else setTimeout(()=>ping('d30'),30000);}catch(e){setTimeout(()=>ping('d30'),30000);}});
})();
</script>
</body></html>
