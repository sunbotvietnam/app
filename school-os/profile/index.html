<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f47a2a">
<title>Hồ sơ Sunbot Việt Nam</title>
<style>
:root{--brand:#f47a2a;--ink:#20262e;--muted:#6e7782;--line:#e9e3dd;--soft:#fff7f0}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(145deg,#fff9f4,#f5f7fa);color:var(--ink);display:grid;place-items:center;padding:24px}.card{width:min(520px,94vw);background:#fff;border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 24px 70px rgba(30,38,48,.10);text-align:center}.logo{width:54px;height:54px;border-radius:17px;margin:0 auto 16px;background:linear-gradient(135deg,var(--brand),#ffb15a);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:900}.brand{font-size:20px;font-weight:850}.verified{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:6px 10px;border-radius:999px;background:var(--soft);color:#9c4f1d;font-size:12px;font-weight:750}.title{font-size:18px;font-weight:780;margin:24px 0 6px}.desc{font-size:13px;line-height:1.6;color:var(--muted);margin:0 auto;max-width:390px}.loader{width:32px;height:32px;border:3px solid #f3e5da;border-top-color:var(--brand);border-radius:50%;margin:24px auto 10px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.status{font-size:12px;color:var(--muted)}.error{display:none;margin-top:20px;padding:14px;border-radius:12px;background:#fff3f3;color:#a64242;font-size:13px;line-height:1.5}.actions{display:none;margin-top:16px}.btn{display:inline-block;text-decoration:none;border-radius:11px;padding:10px 14px;background:var(--brand);color:#fff;font-weight:750;font-size:13px}.foot{margin-top:24px;padding-top:18px;border-top:1px solid #eee9e5;font-size:11px;color:#8b939c}.foot a{color:#5f6873;text-decoration:none}
</style>
</head>
<body>
<main class="card">
  <div class="logo">S</div>
  <div class="brand">SUNBOT VIỆT NAM</div>
  <div class="verified">✓ Hồ sơ chính thức từ Sunbot</div>
  <div class="title">Đang mở hồ sơ chương trình</div>
  <p class="desc">Liên kết này được phát hành trực tiếp bởi hệ thống Sunbot dành cho nhà trường và đối tác.</p>
  <div class="loader" id="loader"></div>
  <div class="status" id="status">Đang xác thực liên kết an toàn…</div>
  <div class="error" id="error"></div>
  <div class="actions" id="actions"><a class="btn" href="https://sunbot.vn/">Về trang Sunbot.vn</a></div>
  <div class="foot">Sunbot · Sản phẩm giáo dục công nghệ của Kiro Việt Nam<br><a href="https://sunbot.vn/">sunbot.vn</a></div>
</main>
<script>
(async function(){
  const BACKEND='https://script.google.com/macros/s/AKfycbxp7J5ZBUKIipF-gVx6Fzp6J3HI_ieyDH_pTXkQ2wXkT87jqp7SBOrldpuwuuo6C0wg-Q/exec';
  const q=new URLSearchParams(location.search),code=(q.get('c')||'').trim().toUpperCase();
  const status=document.getElementById('status'),err=document.getElementById('error'),loader=document.getElementById('loader'),actions=document.getElementById('actions');
  function fail(msg){loader.style.display='none';status.style.display='none';err.textContent=msg;err.style.display='block';actions.style.display='block';}
  if(!/^[A-Z2-9]{6,12}$/.test(code))return fail('Liên kết hồ sơ không hợp lệ. Vui lòng kiểm tra lại liên kết được Sunbot gửi.');
  try{
    const res=await fetch(BACKEND,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'resolve_public_link',public_code:code}),redirect:'follow'});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    if(!data.success||!/^https:\/\//i.test(data.destination_url||''))throw new Error(data.error||'Không tìm thấy hồ sơ.');
    status.textContent='Đã xác thực. Đang mở '+(data.document_name||'hồ sơ Sunbot')+'…';
    setTimeout(()=>location.replace(data.destination_url),220);
  }catch(e){fail('Không thể mở hồ sơ lúc này. Vui lòng thử lại hoặc liên hệ người gửi từ Sunbot.');}
})();
</script>
</body>
</html>
