<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F36F21" />
  <title>Sunbot Finance OS</title>
  <style>
    :root{--orange:#F36F21;--orange-50:#FFF7ED;--orange-100:#FFEDD5;--orange-200:#FED7AA;--slate:#172033;--muted:#667085;--line:#E8ECF2;--green:#039855;--blue:#2563EB;--red:#D92D20;--shadow:0 22px 55px -34px rgba(15,23,42,.45)}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--slate);background:#F8FAFC}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
    .shell{min-height:100vh}.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.wrap{width:min(1280px,calc(100% - 28px));margin:0 auto}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0}.brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;object-fit:contain;border-radius:14px;background:#fff;border:1px solid var(--orange-200);padding:5px}.kicker{margin:0;font-size:11px;font-weight:900;color:var(--orange);letter-spacing:.14em;text-transform:uppercase}.title{margin:3px 0 0;font-size:22px;line-height:1.1;font-weight:950}.user{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:850;background:#fff;border:1px solid var(--line);color:var(--muted)}.btn{border:1px solid transparent;border-radius:14px;padding:10px 13px;font-weight:850;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}.btn-primary{background:var(--orange);color:#fff}.btn-soft{background:var(--orange-50);border-color:var(--orange-200);color:#9A3412}.btn-white{background:#fff;border-color:var(--line);color:var(--slate)}.btn-danger{background:#FEF3F2;border-color:#FECDCA;color:#B42318}.main{padding:18px 0 38px}.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(320px,.8fr);gap:16px;align-items:stretch}.panel{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}.hero-copy{padding:22px;background:linear-gradient(135deg,#fff 0%,var(--orange-50) 100%)}.hero-copy h1{margin:10px 0 0;font-size:34px;line-height:1.05;letter-spacing:0;font-weight:950}.hero-copy p{margin:10px 0 0;color:var(--muted);font-size:15px;line-height:1.6}.filters{padding:18px}.grid{display:grid;gap:12px}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}.field{display:flex;flex-direction:column;gap:6px}.label{font-size:12px;font-weight:900;color:#475467}.input,.select{width:100%;border:1px solid var(--line);border-radius:14px;background:#fff;padding:11px 12px;outline:none}.input:focus,.select:focus{border-color:var(--orange);box-shadow:0 0 0 4px rgba(243,111,33,.12)}.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:16px}.stat{padding:16px}.stat span{display:block;color:var(--muted);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.06em}.stat strong{display:block;margin-top:8px;font-size:25px;font-weight:950}.stat small{display:block;margin-top:5px;color:var(--muted)}.tabs{display:flex;gap:8px;overflow:auto;margin:16px 0}.tab{background:#fff;border:1px solid var(--line);border-radius:999px;padding:10px 14px;font-weight:900;color:#475467}.tab.active{background:var(--slate);border-color:var(--slate);color:#fff}.content{display:none}.content.active{display:block}.section-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin:0 0 12px}.section-head h2{margin:0;font-size:22px;font-weight:950}.section-head p{margin:5px 0 0;color:var(--muted);font-size:13px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:18px;background:#fff}table{width:100%;border-collapse:collapse;min-width:920px}th,td{padding:12px;border-bottom:1px solid #EEF2F6;text-align:left;vertical-align:top;font-size:13px}th{background:#F9FAFB;color:#475467;font-size:11px;text-transform:uppercase;letter-spacing:.06em}.money{text-align:right;font-variant-numeric:tabular-nums}.bar-list{display:grid;gap:10px}.bar-row{display:grid;grid-template-columns:190px minmax(120px,1fr) 120px;gap:10px;align-items:center}.bar-label{font-size:13px;font-weight:850;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar-track{height:12px;border-radius:999px;background:#EEF2F6;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,var(--orange),#FDB022)}.notice{padding:14px;border-radius:18px;border:1px solid #FEDF89;background:#FFFAEB;color:#93370D;font-size:13px;line-height:1.55}.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px;background:#fff}.modal{position:fixed;inset:0;background:rgba(15,23,42,.7);z-index:50;display:flex;align-items:center;justify-content:center;padding:14px}.modal-card{width:min(720px,100%);max-height:calc(100vh - 28px);overflow:auto;background:#fff;border-radius:24px;padding:20px;border:1px solid var(--line);box-shadow:0 30px 80px -35px rgba(0,0,0,.55)}.modal-card h3{margin:0;font-size:22px}.msg{font-size:13px;font-weight:850;margin-top:10px}.ok{color:var(--green)}.err{color:var(--red)}.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}.login-card{width:min(430px,100%);padding:24px}.login-card .logo{display:block;margin:0 auto 12px}.login-card h1{text-align:center;margin:0;font-size:28px}.login-card p{text-align:center;color:var(--muted);line-height:1.55}
    @media(max-width:980px){.hero,.split,.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.hero-copy h1{font-size:28px}.top{align-items:flex-start}.user{justify-content:flex-start}.bar-row{grid-template-columns:1fr}.bar-track{height:10px}}
  </style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  const SCC_AUTH_URL='https://script.google.com/macros/s/AKfycbyCvtM2pPiTw2j03jgxTwDgfwweG2-NxrsMbaXlrBpa8GjDycScohYkpenrniBqVxe3/exec';
  const MODULE_ID='finance';
  const LOGO='https://sunbotvietnam.github.io/portal/assets/img/logo-sunbot.png';
  const state={token:'',user:null,tab:new URLSearchParams(location.search).get('tab')||'dashboard',period:defaultPeriod(),data:null,loading:false};
  const $=id=>document.getElementById(id);
  const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const attr=esc;
  const money=v=>new Intl.NumberFormat('vi-VN',{style:'currency',currency:'VND',maximumFractionDigits:0}).format(Number(v||0));
  const num=v=>new Intl.NumberFormat('vi-VN').format(Number(v||0));
  function defaultPeriod(){const d=new Date();return{from_date:new Date(d.getFullYear(),d.getMonth(),1).toISOString().slice(0,10),to_date:new Date(d.getFullYear(),d.getMonth()+1,0).toISOString().slice(0,10)}}
  async function api(payload){const res=await fetch(SCC_AUTH_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});const text=await res.text();try{return JSON.parse(text)}catch(e){throw new Error(text||'Không đọc được phản hồi hệ thống')}}
  function init(){state.token=new URLSearchParams(location.search).get('scc_token')||localStorage.getItem('scc_token')||'';if(state.token){localStorage.setItem('scc_token',state.token);showApp();refresh()}else showLogin()}
  function showLogin(){document.body.innerHTML=`<div class="login"><div class="panel login-card"><img class="logo" src="${LOGO}" alt="Sunbot"><h1>Sunbot Finance OS</h1><p>Đăng nhập bằng tài khoản Sunbot Command Center để xem doanh thu, hóa đơn và lương giáo viên.</p><div class="field"><span class="label">Tài khoản</span><input id="loginId" class="input" autocomplete="username"></div><div class="field"><span class="label">Mật khẩu</span><input id="loginPass" class="input" type="password" autocomplete="current-password"></div><button class="btn btn-primary" style="width:100%;margin-top:14px" onclick="login()">Đăng nhập</button><div id="loginMsg" class="msg"></div></div></div>`}
  window.login=async function(){const username=$('loginId').value.trim(),password=$('loginPass').value;if(!username||!password){msg('loginMsg','Cần nhập tài khoản và mật khẩu.','err');return}msg('loginMsg','Đang đăng nhập...','');try{const r=await api({action:'login',username,password,module_id:MODULE_ID,source:'finance_os'});if(!r.ok)throw new Error(r.message||'Không đăng nhập được');state.token=r.token;localStorage.setItem('scc_token',state.token);showApp();await refresh()}catch(e){msg('loginMsg',e.message,'err')}}
  function showApp(){document.body.innerHTML=`<div class="shell"><header class="topbar"><div class="wrap top"><div class="brand"><img class="logo" src="${LOGO}" alt="Sunbot"><div><p class="kicker">Sunbot Finance OS</p><h1 class="title">Quản trị doanh thu, hóa đơn và lương</h1></div></div><div class="user"><span class="pill" id="userPill">Đang tải...</span><button class="btn btn-white" onclick="refresh()">Cập nhật</button><button class="btn btn-soft" onclick="logout()">Đăng xuất</button></div></div></header><main class="wrap main" id="main"></main></div>`;render()}
  window.logout=function(){localStorage.removeItem('scc_token');location.href=location.pathname}
  async function refresh(){state.loading=true;render();try{const r=await api({action:'finance_sync',token:state.token,filters:state.period});if(!r.ok)throw new Error(r.message||'Không tải được Finance OS');state.data=r;state.user=r.user;state.period=r.period;if($('userPill'))$('userPill').textContent=(r.user.display_name||r.user.email)+' · '+r.user.role_id;render()}catch(e){renderError(e.message)}finally{state.loading=false}}
  window.refresh=refresh;
  function render(){const m=$('main');if(!m)return;if(state.loading&&!state.data){m.innerHTML='<div class="empty">Đang tải dữ liệu tài chính...</div>';return}const d=state.data;if(!d){m.innerHTML='';return}const t=d.dashboard.total;const missing=(d.missing.school_rates.length+d.missing.teacher_rates.length);m.innerHTML=`<section class="hero"><div class="panel hero-copy"><span class="pill">Dữ liệu từ báo cáo ca học</span><h1>Từ số tiết dạy đến doanh thu và lương, trong một màn hình.</h1><p>Finance OS lấy ca học thực tế từ hệ thống vận hành, áp đơn giá đã ghi nhớ theo trường/giáo viên, rồi tổng hợp theo ngày, vùng, trường và giáo viên.</p></div><div class="panel filters"><div class="grid grid-2"><label class="field"><span class="label">Từ ngày</span><input class="input" id="fromDate" type="date" value="${attr(d.period.from_date)}"></label><label class="field"><span class="label">Đến ngày</span><input class="input" id="toDate" type="date" value="${attr(d.period.to_date)}"></label></div><button class="btn btn-primary" style="margin-top:12px;width:100%" onclick="applyPeriod()">Xem kỳ này</button>${missing?`<div class="notice" style="margin-top:12px"><b>Cần nhập đơn giá:</b> ${missing} trường/giáo viên đang thiếu đơn giá nên doanh thu hoặc lương chưa đủ.</div>`:''}</div></section><section class="stats">${stat('Số buổi',num(t.sessions),'ca đã nộp')}${stat('Số lớp',num(t.classes),'lượt lớp')}${stat('Doanh thu',money(t.revenue),'ước tính')}${stat('Lương GV',money(t.salary),'ước tính')}${stat('Chênh lệch',money(t.margin),'trước chi phí khác')}</section>${tabs()}${content()}`;}
  function stat(label,value,note){return`<article class="panel stat"><span>${label}</span><strong>${value}</strong><small>${note}</small></article>`}
  function tabs(){return`<nav class="tabs">${[['dashboard','Dashboard'],['billing','Hóa đơn'],['payroll','Lương GV'],['rates','Đơn giá'],['sessions','Ca học']].map(x=>`<button class="tab ${state.tab===x[0]?'active':''}" onclick="setTab('${x[0]}')">${x[1]}</button>`).join('')}</nav>`}
  window.setTab=function(tab){state.tab=tab;history.replaceState(null,'',location.pathname+'?tab='+tab+(state.token?'&scc_token='+encodeURIComponent(state.token):''));render()}
  window.applyPeriod=function(){state.period={from_date:$('fromDate').value,to_date:$('toDate').value};refresh()}
  function content(){if(state.tab==='rates')return ratesView();if(state.tab==='billing')return billingView();if(state.tab==='payroll')return payrollView();if(state.tab==='sessions')return sessionsView();return dashboardView()}
  function dashboardView(){const d=state.data.dashboard;return`<section class="content active"><div class="split"><div class="panel" style="padding:18px"><div class="section-head"><div><h2>Doanh thu theo vùng</h2><p>HN/NA tự nhận diện từ mã trường.</p></div></div>${bars(d.by_region,'revenue')}</div><div class="panel" style="padding:18px"><div class="section-head"><div><h2>Top trường theo doanh thu</h2><p>Dựa trên đơn giá đang có hiệu lực.</p></div></div>${bars(d.by_school.slice(0,10),'revenue')}</div></div></section>`}
  function bars(rows,key){if(!rows||!rows.length)return'<div class="empty">Chưa có dữ liệu.</div>';const max=Math.max(...rows.map(r=>Number(r[key]||0)),1);return`<div class="bar-list">${rows.map(r=>`<div class="bar-row"><div class="bar-label" title="${attr(r.key)}">${esc(r.key)}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.max(2,Number(r[key]||0)/max*100)}%"></div></div><div class="money">${money(r[key])}</div></div>`).join('')}</div>`}
  function billingView(){const rows=state.data.dashboard.by_school;return tablePanel('Hóa đơn theo trường','Số liệu dự kiến để đối soát/chốt kỳ.',rows,['Trường','Buổi','Lớp','Trẻ','Doanh thu'],r=>[`<b>${esc(r.key)}</b>`,num(r.sessions),num(r.classes),num(r.attendance),money(r.revenue)])}
  function payrollView(){const rows=state.data.dashboard.by_teacher;return tablePanel('Lương giáo viên','Tính theo đơn giá giáo viên đang có hiệu lực.',rows,['Giáo viên','Buổi','Lớp','Tổng trẻ','Lương'],r=>[`<b>${esc(r.key)}</b>`,num(r.sessions),num(r.classes),num(r.attendance),money(r.salary)])}
  function sessionsView(){return tablePanel('Ca học thực tế','Nguồn từ CLASS_SESSIONS_NEW.',state.data.sessions,['Ngày','Trường','Giáo viên','Lớp','Trẻ','DT','Lương'],r=>[esc(r.session_date),esc(r.school_name),esc(r.teacher_name),num(r.class_count),num(r.total_attendance),money(r.revenue),money(r.salary)])}
  function tablePanel(title,sub,rows,heads,cells){return`<section class="content active"><div class="section-head"><div><h2>${title}</h2><p>${sub}</p></div></div>${!rows||!rows.length?'<div class="empty">Chưa có dữ liệu.</div>':`<div class="table-wrap"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cells(r).map((c,i)=>`<td class="${i>=heads.length-2?'money':''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}</section>`}
  function ratesView(){const d=state.data;return`<section class="content active"><div class="split"><div>${ratePanel('school','Đơn giá trường',d.schools,d.missing.school_rates)}</div><div>${ratePanel('teacher','Đơn giá giáo viên',d.teachers,d.missing.teacher_rates)}</div></div></section>`}
  function ratePanel(type,title,rows,missing){const ids=new Set((missing||[]).map(x=>x.id));return`<div class="panel" style="padding:18px"><div class="section-head"><div><h2>${title}</h2><p>Nhập một lần, hệ thống ghi nhớ theo ngày hiệu lực.</p></div></div><div class="table-wrap"><table style="min-width:620px"><thead><tr><th>Mã</th><th>Tên</th><th>Model</th><th>Đơn giá</th><th></th></tr></thead><tbody>${rows.map(r=>{const id=type==='school'?r.school_id:r.teacher_id;return`<tr><td>${esc(id)}</td><td>${esc(type==='school'?r.school_name:r.teacher_name)}</td><td>${esc(type==='school'?(r.billing_model||''):(r.salary_model||''))}${ids.has(String(id))?' <span class="pill">Thiếu</span>':''}</td><td class="money">${rateText(type,r)}</td><td><button class="btn btn-soft" onclick='openRate("${type}",${JSON.stringify(r).replace(/'/g,'&#39;')})'>Sửa</button></td></tr>`}).join('')}</tbody></table></div></div>`}
  function rateText(type,r){if(type==='school')return money(r.revenue_per_session||r.revenue_per_class||r.revenue_per_child||r.monthly_fixed_fee||r.tuition_unit_price||0);return money(r.rate_per_session||r.rate_per_class||r.monthly_fixed_salary||0)}
  window.openRate=function(type,row){const school=type==='school';document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="rateModal"><div class="modal-card"><h3>${school?'Đơn giá trường':'Đơn giá giáo viên'}</h3><p style="color:var(--muted);margin-top:6px">${esc(school?row.school_name:row.teacher_name)} · ${esc(school?row.school_id:row.teacher_id)}</p><div class="grid grid-2">${school?schoolRateFields(row):teacherRateFields(row)}</div><div class="field"><span class="label">Ghi chú</span><input id="rateNote" class="input" value="${attr(row.note||'')}"></div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn btn-white" onclick="closeRate()">Đóng</button><button class="btn btn-primary" onclick="saveRate('${type}')">Lưu đơn giá</button></div><div id="rateMsg" class="msg"></div></div></div>`)}
  function schoolRateFields(r){return`${hidden('school_id',r.school_id)}${hidden('school_name',r.school_name)}${field('billing_model','Model','select',r.billing_model||'per_session',[['per_session','Theo buổi'],['per_class','Theo lớp/buổi'],['per_child','Theo lượt trẻ'],['monthly_fixed','Cố định tháng']])}${field('valid_from','Hiệu lực từ','date',r.valid_from||new Date().toISOString().slice(0,10))}${field('revenue_per_session','Doanh thu/buổi','number',r.revenue_per_session||'')}${field('revenue_per_class','Doanh thu/lớp','number',r.revenue_per_class||'')}${field('revenue_per_child','Doanh thu/trẻ','number',r.revenue_per_child||'')}${field('monthly_fixed_fee','Phí cố định/tháng','number',r.monthly_fixed_fee||'')}${field('planned_sessions','Số buổi kế hoạch','number',r.planned_sessions||'')}${field('collection_method','Hình thức thu','text',r.collection_method||'')}`}
  function teacherRateFields(r){return`${hidden('teacher_id',r.teacher_id)}${hidden('teacher_name',r.teacher_name)}${field('salary_model','Model','select',r.salary_model||'per_session',[['per_session','Theo buổi'],['per_class','Theo lớp/buổi'],['monthly_fixed','Cố định tháng']])}${field('valid_from','Hiệu lực từ','date',r.valid_from||new Date().toISOString().slice(0,10))}${field('rate_per_session','Lương/buổi','number',r.rate_per_session||'')}${field('rate_per_class','Lương/lớp','number',r.rate_per_class||'')}${field('monthly_fixed_salary','Lương cố định/tháng','number',r.monthly_fixed_salary||'')}${field('assistant_rate_per_session','Trợ giảng/buổi','number',r.assistant_rate_per_session||'')}`}
  function hidden(id,v){return`<input type="hidden" id="${id}" value="${attr(v||'')}">`}
  function field(id,label,type,value,options){if(type==='select')return`<label class="field"><span class="label">${label}</span><select class="select" id="${id}">${options.map(o=>`<option value="${o[0]}" ${o[0]===value?'selected':''}>${o[1]}</option>`).join('')}</select></label>`;return`<label class="field"><span class="label">${label}</span><input class="input" id="${id}" type="${type}" value="${attr(value||'')}"></label>`}
  window.closeRate=function(){const m=$('rateModal');if(m)m.remove()}
  window.saveRate=async function(type){const school=type==='school';const ids=school?['school_id','school_name','billing_model','valid_from','revenue_per_session','revenue_per_class','revenue_per_child','monthly_fixed_fee','planned_sessions','collection_method']:['teacher_id','teacher_name','salary_model','valid_from','rate_per_session','rate_per_class','monthly_fixed_salary','assistant_rate_per_session'];const rate={note:$('rateNote').value};ids.forEach(id=>rate[id]=$(id).value);msg('rateMsg','Đang lưu...','');try{const r=await api({action:'finance_upsert_rate',token:state.token,type,rate});if(!r.ok)throw new Error(r.message||'Không lưu được đơn giá');msg('rateMsg','Đã lưu đơn giá.','ok');await refresh();closeRate()}catch(e){msg('rateMsg',e.message,'err')}}
  function renderError(message){const m=$('main')||document.body;m.innerHTML=`<div class="empty"><b>Không tải được Finance OS</b><br>${esc(message)}<br><br><button class="btn btn-primary" onclick="logout()">Đăng nhập lại</button></div>`}
  function msg(id,text,cls){const el=$(id);if(el){el.textContent=text;el.className='msg '+(cls||'')}}
  init();
})();
</script>
</body>
</html>
