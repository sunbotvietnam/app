<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F36F21">
  <title>Sunbot Finance OS</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff7ed;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    .card{width:min(430px,calc(100% - 32px));background:white;border:1px solid #fed7aa;border-radius:24px;padding:24px;text-align:center;box-shadow:0 22px 55px -34px rgba(15,23,42,.45)}
    img{width:82px;height:auto}h1{margin:14px 0 8px;font-size:26px;line-height:1.1}p{margin:0;color:#667085;line-height:1.55}.btn{display:inline-flex;margin-top:16px;background:#F36F21;color:white;text-decoration:none;border-radius:14px;padding:12px 16px;font-weight:850}
  </style>
  <script>
    const target = 'https://script.google.com/macros/s/AKfycbyCvtM2pPiTw2j03jgxTwDgfwweG2-NxrsMbaXlrBpa8GjDycScohYkpenrniBqVxe3/exec?module=finance' + (location.search ? '&' + location.search.slice(1) : '');
    location.replace(target);
  </script>
</head>
<body>
  <main class="card">
    <img src="https://sunbotvietnam.github.io/portal/assets/img/logo-sunbot.png" alt="Sunbot">
    <h1>Đang mở Finance OS</h1>
    <p>Finance OS đã chuyển sang Apps Script để không bị lỗi fetch/CORS.</p>
    <a class="btn" id="openLink" href="https://script.google.com/macros/s/AKfycbyCvtM2pPiTw2j03jgxTwDgfwweG2-NxrsMbaXlrBpa8GjDycScohYkpenrniBqVxe3/exec?module=finance">Mở Finance OS</a>
  </main>
  <script>document.getElementById('openLink').href = target;</script>
</body>
</html>
