  <title>Sunbot Teacher Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root { --safe-top: env(safe-area-inset-top, 16px); --safe-bottom: env(safe-area-inset-bottom, 18px); }
    html, body { margin:0; min-height:100%; background:#F2F2F7; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif; -webkit-tap-highlight-color:transparent; }
    input, select, textarea { font-size:16px !important; background:#fff; }
    .active-scale:active { transform:scale(.98); opacity:.85; transition:.08s; }
    .loader { border:3px solid #f3f3f3; border-top:3px solid #FF6B00; border-radius:50%; width:26px; height:26px; animation:spin 1s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .fade { animation: fade .2s ease-out; }
    @keyframes fade { from { opacity:0; transform:translateY(8px);} to {opacity:1; transform:translateY(0);} }
  </style>
</head>

<script>
(function(){

  const CHILD_SIGNALS = ["Hào hứng tham gia", "Biết hợp tác", "Biết chờ lượt", "Biết thử lại", "Biết quan sát robot", "Tự tin hơn", "Có ý tưởng sáng tạo", "Hỗ trợ bạn", "Cần hỗ trợ thêm"];
  const LESSON_PREFIX_HINT = "Gõ L = Sunbot, Q = STEAM, T = Tổng kết, G = Gigo, K = Các bài còn lại";

  const TEACHER_QUOTES = [
    "Mỗi giờ học tốt bắt đầu từ một người thầy có mặt thật sự với trẻ.",
    "Dạy công nghệ cho trẻ nhỏ không phải để trẻ thành kỹ sư sớm, mà để trẻ biết tò mò, thử lại và tự tin khám phá.",
    "Một khoảnh khắc trẻ hiểu ra điều mới chính là phần thưởng đẹp nhất của người dạy.",
    "Giáo dục STEAM bắt đầu từ đôi mắt biết quan sát và đôi tay dám thử nghiệm.",
    "Người giáo viên tốt không chỉ truyền đạt bài học, mà còn mở ra cho trẻ một cách nhìn thế giới.",
    "Hôm nay trẻ biết chờ lượt, hợp tác và thử lại; đó đã là một bước tiến rất đáng ghi nhận.",
    "Robot là công cụ. Điều quan trọng hơn là trẻ học cách suy nghĩ, lựa chọn và cùng bạn giải quyết nhiệm vụ.",
    "Một lớp học có giá trị là lớp học để lại trong trẻ sự háo hức muốn khám phá thêm.",
    "Mỗi báo cáo ca học không chỉ là dữ liệu, mà là dấu vết của một hành trình giáo dục.",
    "Người dạy trẻ nhỏ cần sự chính xác của người làm nghề và sự ấm áp của người đồng hành."
  ];
  const SESSION_QUOTE = TEACHER_QUOTES[Math.floor(Math.random() * TEACHER_QUOTES.length)];
  const CONFIG_CACHE_KEY = "sunbot_report_config_cache_v35";
  const CONFIG_CACHE_TTL_MS = 12 * 60 * 60 * 1000;
  const ENROLLMENT_CACHE_PREFIX = "sunbot_enrollment_cache_v35_";
  const HUB_SETTINGS_KEY = "sunbot_hub_settings_v1";
  const TENANT_PROVISION_LOG_KEY = "sunbot_tenant_provision_log_v1";
  const ACTIVE_SCOPE_KEY = "sunbot_active_scope_v1";

  const DEMO_CONFIG = {
    teachers: [
      {teacher_id:"TCH-DEMO-001", teacher_name:"Giáo viên Demo", active:true},
      {teacher_id:"TCH-HN-DMH", teacher_name:"Đỗ Thị Minh Hằng", active:true}
    ],
    schools: [
      {school_id:"HN-QM", school_name:"Quỳnh Mai", active:true},
      {school_id:"NA-HHT", school_name:"Hà Huy Tập", active:true}
    ],
    classes: [
      {class_id:"CLS-HN-QM-2526-A1", school_id:"HN-QM", class_name:"A1", student_count:25, active:true},
      {class_id:"CLS-HN-QM-2526-A4", school_id:"HN-QM", class_name:"A4", student_count:24, active:true},
      {class_id:"CLS-HN-QM-2526-B2", school_id:"HN-QM", class_name:"B2", student_count:26, active:true},
      {class_id:"CLS-NA-HHT-2526-4A", school_id:"NA-HHT", class_name:"4A", student_count:23, active:true}
    ],
    lessons: [
      {lesson_id:"LES-TKT-003", lesson_code:"TKT-3", lesson_name:"Tư duy thuật toán 3", program_type:"Niên chế", module:"Robot", active:true},
      {lesson_id:"LES-Q2-019", lesson_code:"Q2-19", lesson_name:"Bài Q2-19", program_type:"Niên chế", module:"Robot", active:true},
      {lesson_id:"LES-LV3-B9", lesson_code:"LV3-B9", lesson_name:"LV3-B9", program_type:"Niên chế", module:"Robot", active:true}
    ],
    enrollment: [
      {child_id:"SBK-000001", enrollment_id:"ENR-HN-QM-2526-A1-001", child_name:"Nguyễn Gia Bảo A", school_id:"HN-QM", class_id:"CLS-HN-QM-2526-A1", class_name:"A1", status:"học"},
      {child_id:"SBK-000002", enrollment_id:"ENR-HN-QM-2526-A1-002", child_name:"Nguyễn Diệu Anh", school_id:"HN-QM", class_id:"CLS-HN-QM-2526-A1", class_name:"A1", status:"học"},
      {child_id:"SBK-000010", enrollment_id:"ENR-HN-QM-2526-A4-001", child_name:"Trần Minh Khang", school_id:"HN-QM", class_id:"CLS-HN-QM-2526-A4", class_name:"A4", status:"học"}
    ]
  };

  const state = {
    auth: {
      token: localStorage.getItem('sbtp_token') || '',
      user: JSON.parse(localStorage.getItem('sbtp_user') || 'null'),
      permissions: JSON.parse(localStorage.getItem('sbtp_permissions') || '{}'),
      teacherProfile: null,
      academy: null,
      error: '',
      loading: false
    },
    hubModule: 'report',
    showAccountAdmin: false,
    showHubSettings: false,
    showSystemAdmin: false,
    hubSettings: loadHubSettings(),
    activeScope: loadActiveScope(),
    hubSettingsAdmin: { loading:false, error:'', ok:'' },
    accountAdmin: { loading:false, error:'', ok:'' },
    operationalAdmin: { loading:false, error:'', ok:'' },
    systemAdmin: { loading:false, listLoading:false, error:'', ok:'', listError:'', last:null, log: loadTenantProvisionLog(), tenants:null },
    loading: false,
    configLoading: true,
    enrollmentLoading: false,
    configError: "",
    enrollmentError: "",
    config: {teachers:[], schools:[], classes:[], lessons:[], enrollment:[]},
    data: {
      teacher_id:"", school_id:"", session_date: todayISO(), lesson_id:"", lesson_search:"",
      report_type:"REG",
      selected_classes: [""], class_attendance: {},
      checklist: CHECKLIST.map(()=>false),
      incident_status:"NO", incident_desc:"",
      attendance_photo_b64:"", activity_photo_b64:"",
      criteria: CRITERIA.map(()=>"Đạt"),
      monthly_photos: Array(6).fill(0).map(()=>({cat:PHOTO_CATS[0], img:""})),
      outstanding_children: [], attention_children: [], child_note_text:"",
      highlight:"", needs_attention:"", teacher_comment:"", next_plan:"",
      memory_enabled:false, memory_title:"", memory_signal:"", memory_description:"", memory_photo_b64:""
    },
    lastResult: null,
    lastReceipt: null,
    showMyReports: false,
    myReports: { teacher_id:"", pin:"", period:"today", loading:false, error:"", data:null }
  };

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const norm = (v) => String(v == null ? "" : v).trim();
  function loadHubSettings(){
    try{
      const saved = JSON.parse(localStorage.getItem(HUB_SETTINGS_KEY) || '{}');
      return Object.assign({ internalCenterUrl: DEFAULT_INTERNAL_CENTER_URL }, saved || {});
    }catch(e){
      return { internalCenterUrl: DEFAULT_INTERNAL_CENTER_URL };
    }
  }
  function saveHubSettingsLocal(settings){
    state.hubSettings = Object.assign({}, state.hubSettings, settings || {});
    try{ localStorage.setItem(HUB_SETTINGS_KEY, JSON.stringify(state.hubSettings)); }catch(e){}
  }
  function loadActiveScope(){
    try{
      const saved = JSON.parse(localStorage.getItem(ACTIVE_SCOPE_KEY) || '{}');
      return Object.assign({ tenant_id:'', school_year_id:'' }, saved || {});
    }catch(e){
      return { tenant_id:'', school_year_id:'' };
    }
  }
  function saveActiveScope(scope){
    state.activeScope = Object.assign({}, state.activeScope || {}, scope || {});
    try{ localStorage.setItem(ACTIVE_SCOPE_KEY, JSON.stringify(state.activeScope)); }catch(e){}
  }
  function applyHubSettings(payload){
    const src = payload && (payload.hubSettings || payload.settings || payload.config);
    if(src && src.internalCenterUrl) saveHubSettingsLocal({ internalCenterUrl: src.internalCenterUrl });
  }
  function hubInternalCenterUrl(){
    return norm(state.hubSettings && state.hubSettings.internalCenterUrl) || DEFAULT_INTERNAL_CENTER_URL;
  }
  function validHttpUrl(url){
    try{ const u = new URL(url); return ['http:','https:'].includes(u.protocol); }catch(e){ return false; }
  }
  function loadTenantProvisionLog(){
    try{ return JSON.parse(localStorage.getItem(TENANT_PROVISION_LOG_KEY) || '[]').slice(0,8); }catch(e){ return []; }
  }
  function rememberTenantProvision(entry){
    const item = Object.assign({ at: new Date().toISOString() }, entry || {});
    state.systemAdmin.last = item;
    state.systemAdmin.log = [item].concat(state.systemAdmin.log || []).slice(0,8);
    try{ localStorage.setItem(TENANT_PROVISION_LOG_KEY, JSON.stringify(state.systemAdmin.log)); }catch(e){}
  }
  function formatTime(iso){
    if(!iso) return '';
    try{ return new Date(iso).toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit',year:'numeric'}); }catch(e){ return iso; }
  }
  function tenantRowsFromLog(){
    const seen = new Set();
    const rows = (state.systemAdmin.log || []).filter(x=>{
      const id = String(x.tenant_id || '').trim();
      if(!id || seen.has(id)) return false;
      seen.add(id);
      return true;
    }).map(x=>({
      tenant_id: x.tenant_id,
      tenant_name: x.tenant_name || '',
      tenant_type: x.tenant_type || '',
      status: x.status === 'CONFIRMED' ? 'CONFIRMED_LOCAL' : x.status,
      source: 'local_log',
      updated_at: x.at
    }));
    if(!seen.has('HEAD')) rows.push({
      tenant_id: 'HEAD',
      tenant_name: 'Sunbot Head',
      tenant_type: 'HEAD',
      status: 'BLUEPRINT_DEFAULT',
      source: 'blueprint',
      updated_at: ''
    });
    return rows;
  }
  function normalizeTenantRows(rows){
    return (rows || []).map(t=>({
      tenant_id: t.tenant_id || t.TenantID || t.id || '',
      tenant_name: t.tenant_name || t.TenantName || t.name || '',
      tenant_type: t.tenant_type || t.TenantType || t.type || '',
      status: t.status || t.Status || '',
      active_school_year_id: t.active_school_year_id || t.ActiveSchoolYearID || t.school_year_id || '',
      backend_mode: t.backend_mode || t.BackendMode || '',
      data_backend_url: t.data_backend_url || t.DataBackendUrl || t.backend_url || '',
      updated_at: t.updated_at || t.UpdatedAt || t.created_at || ''
    })).filter(t=>t.tenant_id);
  }
  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function isTruthy(v){ return v === true || String(v).toUpperCase() === 'TRUE' || String(v).toLowerCase() === 'active' || String(v).trim() === ''; }
  function postText(url, payload){ return fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}).then(async res=>{const text=await res.text(); try{return JSON.parse(text)}catch(e){throw new Error(text||'Không đọc được phản hồi hệ thống')}}); }
  function isUnsupportedActionError(msg){
    return /action\s+kh[oô]ng\s+[đd][uư][oợ]c\s+h[oỗ]\s+tr[oợ]|action\s+khong\s+duoc\s+ho\s+tro|unsupported\s+action|unknown\s+action/i.test(String(msg || ''));
  }
  function backendErrorText(err, fallback){
    const msg = err && err.message ? err.message : String(err || '');
    if(/phi[eê]n|token|unauthorized|forbidden|quy[eề]n|permission/i.test(msg)) return msg || 'Phiên đăng nhập hoặc quyền truy cập chưa hợp lệ. Vui lòng đăng nhập lại bằng tài khoản admin.';
    return msg || fallback;
  }
  function hubUserName(){ const u=state.auth.user||{}, p=state.auth.teacherProfile||{}; return p.FullName||u.FullName||u.display_name||u.Username||u.username||'Giáo viên Sunbot'; }
  function hubTeacherId(){ const u=state.auth.user||{}, p=state.auth.teacherProfile||{}; return p.TeacherID||u.TeacherID||u.teacher_id||u.UserID||u.Username||u.username||''; }
  function displayTeacherName(name, id){
    const rawName = String(name || '');
    const rawId = String(id || '');
    if(rawId.toUpperCase()==='GV-0016') return 'Giáo viên Test';
    return rawName;
  }
  function hubRoleRaw(){ const u=state.auth.user||{}; return String(u.PermissionGroupID||u.role_id||u.Role||u.role||'').toUpperCase().trim(); }
  function currentTenantId(){
    const u=state.auth.user||{}, p=state.auth.teacherProfile||{};
    if(isHubAdmin() && state.activeScope && state.activeScope.tenant_id) return String(state.activeScope.tenant_id).trim().toUpperCase();
    const explicit = String(u.tenant_id||u.primary_tenant_id||p.tenant_id||p.primary_tenant_id||'').trim().toUpperCase();
    if(explicit) return explicit;
    const raw = String(u.Team||p.Team||'').trim().toUpperCase();
    if(raw && (/^(HEAD|DEMO|SCHOOL_|PARTNER_|FRANCHISE_)/.test(raw))) return raw;
    return DEFAULT_TENANT_ID;
  }
  function currentSchoolYearId(){
    const u=state.auth.user||{}, p=state.auth.teacherProfile||{};
    if(isHubAdmin() && state.activeScope && state.activeScope.school_year_id) return String(state.activeScope.school_year_id).trim() || DEFAULT_SCHOOL_YEAR_ID;
    return String(u.school_year_id||u.active_school_year_id||p.school_year_id||p.active_school_year_id||DEFAULT_SCHOOL_YEAR_ID).trim() || DEFAULT_SCHOOL_YEAR_ID;
  }
  function isHubAdmin(){ const raw=hubRoleRaw(); return raw.includes('ADMIN')||raw.includes('CEO')||raw.includes('STA_ADMIN'); }
  function isSuperAdmin(){
    const raw = hubRoleRaw();
    return raw.includes('SUPER_ADMIN') || raw.includes('CEO') || raw === 'ADMIN' || raw === 'STA_ADMIN';
  }
  function isTeacherAccount(){
    const raw = hubRoleRaw();
    const p = state.auth.teacherProfile || {};
    if(isHubAdmin()) return false;
    return raw.includes('TEACHER') || raw.includes('GIAO_VIEN') || raw.includes('GIÁO_VIÊN') || !!p.TeacherID;
  }
  function isOperationalAccount(){ return !!state.auth.token && !isTeacherAccount(); }
  function hubDisplayName(){ return isHubAdmin() ? hubUserName() : displayTeacherName(hubUserName(), hubTeacherId()); }
  function hubIdentityLine(){ return isHubAdmin() ? 'Admin · ' + (hubTeacherId() || 'Sunbot ID') : hubDisplayName() + ' · ' + (hubTeacherId() || 'Sunbot ID'); }
  function askSuperAdminCode(){
    const code = prompt('Nhập mã xác nhận quản trị để hoàn tất thao tác tài khoản:');
    if(code !== '1906'){
      alert('Mã xác nhận không đúng. Thao tác đã hủy.');
      return '';
    }
    return code;
  }
  function confirmAccountAdminCode(){
    return !!askSuperAdminCode();
  }
  function teacherLocked(){ return !!state.auth.token && !isHubAdmin() && !!state.data.teacher_id; }
  function saveAuth(r){
    state.auth.token = r.token || '';
    state.auth.user = r.user || null;
    state.auth.permissions = r.permissions || {};
    localStorage.setItem('sbtp_token', state.auth.token);
    localStorage.setItem('sbtp_user', JSON.stringify(state.auth.user));
    localStorage.setItem('sbtp_permissions', JSON.stringify(state.auth.permissions));
  }
  function clearAuth(){ localStorage.removeItem('sbtp_token'); localStorage.removeItem('sbtp_user'); localStorage.removeItem('sbtp_permissions'); state.auth.token=''; state.auth.user=null; state.auth.teacherProfile=null; state.auth.academy=null; state.auth.error=''; }
  function byId(arr, key, id){ return (arr||[]).find(x => String(x[key]) === String(id)); }
  function teacher(){ return byId(state.config.teachers, 'teacher_id', state.data.teacher_id) || {}; }
  function school(){ return byId(state.config.schools, 'school_id', state.data.school_id) || {}; }
  function lesson(){ return byId(state.config.lessons, 'lesson_id', state.data.lesson_id) || {}; }
  function classObj(id){ return byId(state.config.classes, 'class_id', id) || {}; }
  function activeClassesForSchool(){ return state.config.classes.filter(c => c.school_id === state.data.school_id && isTruthy(c.active) && String(c.status || 'active').toLowerCase() !== 'closed'); }
  function activeChildren(){
    const set = new Set(state.data.selected_classes.filter(Boolean));
    return state.config.enrollment.filter(e => set.has(e.class_id) && (!e.status || String(e.status).toLowerCase().includes('học') || String(e.status).toLowerCase().includes('hoc') || String(e.status).toLowerCase()==='active'));
  }
  function selectedClassIds(){ return state.data.selected_classes.filter(Boolean); }
  function totalAttendance(){ return selectedClassIds().reduce((sum, cid) => sum + (Number(state.data.class_attendance[cid]) || 0), 0); }
  function saveLocal(){
    const d = state.data;
    localStorage.setItem("sunbot_report_v3", JSON.stringify({teacher_id:d.teacher_id, school_id:d.school_id, lesson_id:d.lesson_id, lesson_search:d.lesson_search}));
  }
  function loadLocal(){
    try { Object.assign(state.data, JSON.parse(localStorage.getItem("sunbot_report_v3") || "{}")); state.data.session_date = todayISO(); } catch(e) {}
  }
  function section(title, sub){ return `<div class="mx-4 mt-3 mb-1"><div class="text-[11px] font-bold tracking-wide uppercase text-gray-500">${esc(title)}</div>${sub ? `<div class="text-[10px] text-gray-400 mt-0.5 leading-tight">${esc(sub)}</div>` : ''}</div>`; }
  function card(html){ return `<div class="bg-white mx-4 rounded-xl shadow-sm border border-gray-100 overflow-hidden">${html}</div>`; }
  function optionList(items, valueKey, labelFn, selected, placeholder){ return `<option value="">${esc(placeholder || "Chọn...")}</option>` + (items||[]).map(x => `<option value="${esc(x[valueKey])}" ${String(x[valueKey])===String(selected)?'selected':''}>${esc(labelFn(x))}</option>`).join(''); }

  function lessonCode(l){ return String(l.lesson_code || l.lesson_id || '').trim().toUpperCase(); }
  function lessonGroupKey(l){
    const code = lessonCode(l);
    if(code.startsWith('L')) return 'L';
    if(code.startsWith('Q')) return 'Q';
    if(code.startsWith('T')) return 'T';
    if(code.startsWith('G')) return 'G';
    return 'K';
  }
  function groupName(key){
    return ({L:'Sunbot', Q:'STEAM', T:'Tổng kết', G:'Gigo', K:'Các bài còn lại', ALL:'Toàn bộ'})[key] || 'Toàn bộ';
  }
  function detectLessonGroup(query){
    const q = norm(query).toUpperCase();
    if(!q) return '';
    const first = q.charAt(0);
    if(['L','Q','T','G','K'].includes(first)) return first;
    return 'ALL';
  }
  function filteredLessons(){
    const all = (state.config.lessons||[]).filter(l => isTruthy(l.active));
    const qRaw = norm(state.data.lesson_search);
    const q = qRaw.toLowerCase();
    if(!qRaw) return [];
    const group = detectLessonGroup(qRaw);
    let pool = all;
    if(group && group !== 'ALL') pool = all.filter(l => lessonGroupKey(l) === group);
    // Nếu giáo viên chỉ gõ 1 chữ nhóm L/Q/T/G/K thì chỉ lọc theo nhóm.
    if(qRaw.trim().length === 1 && ['l','q','t','g','k'].includes(qRaw.trim().toLowerCase())) return pool;
    return pool.filter(l => [l.lesson_code,l.lesson_name,l.program_type,l.module,l.theme].join(' ').toLowerCase().includes(q));
  }
  function activeLessonCount(){ return (state.config.lessons||[]).filter(l => isTruthy(l.active)).length; }
  function lessonSearchSummary(){
    const q = norm(state.data.lesson_search);
    if(!q) return `Chưa lọc bài. ${LESSON_PREFIX_HINT}.`;
    const group = detectLessonGroup(q);
    const shown = filteredLessons().length;
    if(group && group !== 'ALL') return `Đang hiển thị ${shown} bài thuộc nhóm ${group} · ${groupName(group)}. Tổng danh mục: ${activeLessonCount()} bài.`;
    return `Đang hiển thị ${shown}/${activeLessonCount()} bài theo từ khóa “${q}”.`;
  }

  function lessonLabel(l){
    const code = l.lesson_code || l.lesson_id || '';
    const name = l.lesson_name || '';
    return `${code}${name ? ' — ' + name : ''}`;
  }
  function normalizeLessonText(v){ return norm(v).toLowerCase().replace(/\s+/g,' '); }
  function findLessonByInput(input){
    const target = normalizeLessonText(input);
    if(!target) return null;
    return (state.config.lessons || []).find(l => {
      const label = normalizeLessonText(lessonLabel(l));
      const code = normalizeLessonText(l.lesson_code || '');
      const id = normalizeLessonText(l.lesson_id || '');
      return target === label || target === code || target === id || label.startsWith(target + ' —');
    }) || null;
  }

  async function hubLogin(){
    const username = norm(($('hubLoginId')||{}).value);
    const password = norm(($('hubLoginPass')||{}).value);
    if(!username || !password){ state.auth.error='Cần nhập ID và mật khẩu.'; renderLogin(); return; }
    state.auth.loading = true; state.auth.error = ''; renderLogin();
    try{
      const r = await postText(TRAINING_BACKEND_URL,{action:'login',username,password,source:'teacher_hub'});
      if(!r.success) throw new Error(r.message || 'Sai ID hoặc mật khẩu.');
      saveAuth(r);
      await syncHubProfile();
      render();
    } catch(err){
      clearAuth();
      state.auth.error = err.message || String(err);
      renderLogin();
    } finally {
      state.auth.loading = false;
    }
  }
  function hubLogout(){ clearAuth(); renderLogin(); }
  async function syncHubProfile(){
    if(!state.auth.token) return;
    try{
      const r = await postText(TRAINING_BACKEND_URL,{action:'sync_teacher_portal',token:state.auth.token,source:'teacher_hub'});
      if(!r.success) throw new Error(r.message || 'Không đồng bộ được Teacher Hub.');
      state.auth.teacherProfile = r.teacherProfile || {};
      state.auth.academy = r;
      applyHubSettings(r);
      await loadHubSettingsFromBackend();
      syncReportTeacherFromAuth();
    } catch(err){
      state.auth.error = err.message || String(err);
    }
  }
  async function loadHubSettingsFromBackend(){
    try{
      const r = await postText(TRAINING_BACKEND_URL,{action:'get_hub_settings',token:state.auth.token,source:'teacher_hub'});
      if(r && r.success) applyHubSettings(r);
    }catch(e){}
  }
  function syncReportTeacherFromAuth(){
    const profile = state.auth.teacherProfile || {};
    const user = state.auth.user || {};
    const candidates = [profile.TeacherID,user.TeacherID,user.teacher_id,user.UserID,user.Username,user.username,user.Email,user.email].filter(Boolean).map(x=>String(x).toLowerCase());
    const teachers = state.config.teachers || [];
    let found = teachers.find(t=>candidates.includes(String(t.teacher_id||'').toLowerCase()));
    if(!found){
      const name = String(profile.FullName||user.FullName||'').toLowerCase();
      if(name) found = teachers.find(t=>String(t.teacher_name||'').toLowerCase()===name);
    }
    if(found && !state.data.teacher_id){ state.data.teacher_id = found.teacher_id; saveLocal(); }
    if(found && teacherLocked()){ state.data.teacher_id = found.teacher_id; }
    if(found && !state.myReports.teacher_id){ state.myReports.teacher_id = found.teacher_id; }
  }
  function handleHubAction(action){
    if(action==='report'){ state.hubModule='report'; render(); setTimeout(()=>document.getElementById('reportFormStart')?.scrollIntoView({behavior:'smooth'}),0); return; }
    if(action==='evaluation'){ window.location.href = EVALUATION_APP_URL; return; }
    if(action==='academy'){ window.location.href = ACADEMY_APP_URL; return; }
    if(action==='impact'){ window.location.href = IMPACT_APP_URL; return; }
    if(action==='center'){ window.open(hubInternalCenterUrl(), '_blank', 'noopener'); return; }
    if(action==='settings' && isHubAdmin()){ state.showHubSettings = true; render(); setTimeout(()=>document.getElementById('hubInternalUrl')?.scrollIntoView({behavior:'smooth'}),0); return; }
    if(action==='myReports'){ state.showMyReports = true; render(); return; }
    if(action==='accounts'){ state.showAccountAdmin = true; render(); setTimeout(()=>document.getElementById('acctName')?.scrollIntoView({behavior:'smooth'}),0); return; }
    if(action==='system' && isSuperAdmin()){ state.showSystemAdmin = true; render(); setTimeout(()=>document.getElementById('sysTenantId')?.scrollIntoView({behavior:'smooth'}),0); return; }
    if(action==='payroll'){ alert('Mục Thu nhập của tôi đang được xây dựng. Sau khi hoàn thiện, mục này sẽ hiển thị số buổi dạy, đối soát và tổng thu nhập dự kiến.'); }
  }

  async function createHubAccount(){
    if(!isHubAdmin()) return;
    const teacher = {
      FullName: norm(($('acctName')||{}).value),
      Email: norm(($('acctId')||{}).value),
      Pin: norm(($('acctPass')||{}).value),
      Region: norm(($('acctRegion')||{}).value) || currentTenantId(),
      Role: (($('acctRole')||{}).value || 'Teacher')
    };
    if(!teacher.FullName || !teacher.Email || !teacher.Pin){ state.accountAdmin.error='Cần nhập đủ họ tên, ID/email và mật khẩu.'; state.accountAdmin.ok=''; render(); return; }
    const super_code = askSuperAdminCode();
    if(!super_code) return;
    state.accountAdmin.loading=true; state.accountAdmin.error=''; state.accountAdmin.ok=''; render();
    try{
      const r = await postText(TRAINING_BACKEND_URL,{action:'create_teacher_user',token:state.auth.token,teacher,source:'teacher_hub_admin'});
      if(!r.success) throw new Error(r.message || 'Không tạo được tài khoản.');
      const teacherId = r.teacher?.TeacherID || r.teacher?.teacher_id || r.teacher?.TeacherId || r.user?.UserID || teacher.Email;
      const ops = await postText(WEB_APP_URL,{action:'admin_upsert_operational_master',super_code,tenant_id:teacher.Region,school_year_id:currentSchoolYearId(),data:{teachers:[{teacher_id:teacherId,teacher_name:teacher.FullName,teacher_email:teacher.Email,active:true}]},source:'teacher_hub_admin'});
      if(ops.status !== 'success') throw new Error(ops.message || 'Đã tạo tài khoản nhưng chưa đồng bộ được danh mục giáo viên.');
      state.accountAdmin.ok = 'Đã tạo tài khoản: ' + (r.user?.Username || teacher.Email);
      await syncHubProfile();
      await loadConfig();
    }catch(err){ state.accountAdmin.error = err.message || String(err); }
    finally{ state.accountAdmin.loading=false; render(); }
  }

  async function upsertOperationalMaster(kind){
    if(!isHubAdmin()) return;
    const super_code = askSuperAdminCode();
    if(!super_code) return;
    const data = {};
    if(kind === 'school'){
      const school_id = norm(($('opsSchoolId')||{}).value).toUpperCase();
      const school_name = norm(($('opsSchoolName')||{}).value);
      if(!school_id || !school_name){ state.operationalAdmin.error='Cần nhập mã trường và tên trường.'; state.operationalAdmin.ok=''; render(); return; }
      data.schools = [{school_id, school_name, active:true}];
    }
    if(kind === 'class'){
      const class_id = norm(($('opsClassId')||{}).value).toUpperCase();
      const class_name = norm(($('opsClassName')||{}).value);
      const school_id = norm(($('opsClassSchoolId')||{}).value).toUpperCase();
      const school = state.config.schools.find(s=>String(s.school_id||'').toUpperCase()===school_id) || {};
      const active_children = norm(($('opsClassChildren')||{}).value);
      if(!class_id || !class_name || !school_id){ state.operationalAdmin.error='Cần nhập mã lớp, tên lớp và chọn trường.'; state.operationalAdmin.ok=''; render(); return; }
      data.classes = [{class_id, class_name, school_id, school_name:school.school_name||'', active_children, active:true}];
    }
    state.operationalAdmin.loading=true; state.operationalAdmin.error=''; state.operationalAdmin.ok=''; render();
    try{
      const r = await postText(WEB_APP_URL,{action:'admin_upsert_operational_master',super_code,tenant_id:currentTenantId(),school_year_id:currentSchoolYearId(),data,source:'teacher_hub_admin'});
      if(r.status !== 'success') throw new Error(r.message || 'Không cập nhật được dữ liệu vận hành.');
      state.operationalAdmin.ok = r.message || 'Đã cập nhật dữ liệu vận hành.';
      await loadConfig();
    }catch(err){ state.operationalAdmin.error = err.message || String(err); }
    finally{ state.operationalAdmin.loading=false; render(); }
  }

    if(!isHubAdmin()) return;
    const TeacherID = norm(($('acctExisting')||{}).value);

  async function provisionTenantV2(preset){
    if(!isSuperAdmin()) return;
    if(preset === 'HEAD'){
      const set = (id, val) => { const el=$(id); if(el) el.value = val; };
      set('sysTenantId','HEAD');
      set('sysTenantName','Sunbot Head');
      set('sysTenantType','HEAD');
      set('sysRegion','ALL');
      set('sysSchoolYear','SY_2026_2027');
      set('sysBackendMode','SHARED');
    }
    const payload = collectTenantProvisionPayload();
    if(!payload.tenant.tenant_id || !payload.tenant.tenant_name){
      state.systemAdmin.error = 'Cần nhập mã đơn vị và tên đơn vị.';
      state.systemAdmin.ok = '';
      render();
      return;
    }
    if(payload.tenant.backend_mode === 'DEDICATED' && payload.tenant.data_backend_url && !validHttpUrl(payload.tenant.data_backend_url)){
      state.systemAdmin.error = 'Backend URL cần bắt đầu bằng http:// hoặc https://.';
      state.systemAdmin.ok = '';
      render();
      return;
    }
    const super_code = askSuperAdminCode();
    if(!super_code) return;
    rememberTenantProvision({
      status: 'SENT',
      statusText: 'Đã gửi yêu cầu, đang chờ backend xác nhận',
      tenant_id: payload.tenant.tenant_id,
      tenant_type: payload.tenant.tenant_type,
      message: 'Yêu cầu đã được tạo trên frontend và đang gửi tới backend Training.'
    });
    state.systemAdmin.loading = true;
    state.systemAdmin.error = '';
    state.systemAdmin.ok = '';
    render();
    try{
      const r = await postText(TRAINING_BACKEND_URL,{action:'provision_tenant_v2',token:state.auth.token,super_code,tenant:payload.tenant,adminUser:payload.adminUser,source:'teacher_hub_super_admin'});
      if(!r.success) throw new Error(r.message || 'Backend chưa hỗ trợ tạo đơn vị V2.');
      rememberTenantProvision({
        status: 'CONFIRMED',
        statusText: 'Backend đã xác nhận tạo/cập nhật đơn vị',
        tenant_id: payload.tenant.tenant_id,
        tenant_type: payload.tenant.tenant_type,
        backendId: r.tenant_id || r.tenantId || r.id || payload.tenant.tenant_id,
        message: r.message || 'Đơn vị đã được backend xác nhận. Có thể kiểm tra trong bảng TENANTS/USER_TENANT_ACCESS nếu backend đã ghi sheet.'
      });
      state.systemAdmin.ok = 'Backend đã xác nhận đơn vị ' + payload.tenant.tenant_id + '.';
      await syncHubProfile();
      await loadTenantsV2();
    }catch(err){
      const rawMsg = err.message || String(err);
      const unsupported = isUnsupportedActionError(rawMsg);
      const msg = unsupported ? 'Backend V2 chưa kích hoạt action provision_tenant_v2. Yêu cầu chưa được ghi vào TENANTS; cần bổ sung Apps Script trước khi tạo đơn vị chính thức.' : backendErrorText(err, 'Chưa tạo được đơn vị trên backend.');
      rememberTenantProvision({
        status: 'FAILED',
        statusText: 'Chưa tạo được đơn vị trên backend',
        tenant_id: payload.tenant.tenant_id,
        tenant_type: payload.tenant.tenant_type,
        message: msg
      });
      state.systemAdmin.error = msg;
    }finally{
      state.systemAdmin.loading = false;
      render();
    }
  }

  function addChild(key, id){ if(id && !state.data[key].includes(id)) state.data[key].push(id); }
  async function handlePhoto(e){ const file=e.target.files&&e.target.files[0]; if(!file) return; const key=e.target.dataset.key; try { state.loading=true; render(); state.data[key]=await compressImage(file); } catch(err){ alert('Không xử lý được ảnh.'); } finally { state.loading=false; render(); } }
  async function handleMonthlyPhoto(e){ const file=e.target.files&&e.target.files[0]; if(!file) return; const idx=Number(e.target.dataset.idx); try { state.loading=true; render(); state.data.monthly_photos[idx].img=await compressImage(file); } catch(err){ alert('Không xử lý được ảnh.'); } finally { state.loading=false; render(); } }
  function compressImage(file){ return new Promise((resolve,reject)=>{ const reader=new FileReader(); reader.onload=()=>{ const img=new Image(); img.onload=()=>{ let w=img.width,h=img.height; if(w>h&&w>MAX_IMAGE_PX){h=Math.round(h*MAX_IMAGE_PX/w);w=MAX_IMAGE_PX;} else if(h>=w&&h>MAX_IMAGE_PX){w=Math.round(w*MAX_IMAGE_PX/h);h=MAX_IMAGE_PX;} const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h; canvas.getContext('2d').drawImage(img,0,0,w,h); resolve(canvas.toDataURL('image/jpeg',IMAGE_QUALITY)); }; img.onerror=reject; img.src=reader.result; }; reader.onerror=reject; reader.readAsDataURL(file); }); }

  function validate(){
    const d=state.data;
    if(!d.teacher_id) return 'Vui lòng chọn giáo viên.';
    if(!d.school_id) return 'Vui lòng chọn trường.';
    if(!d.session_date) return 'Vui lòng chọn ngày dạy.';
    if(!d.lesson_id) return 'Vui lòng chọn bài học.';
    const ids = selectedClassIds();
    if(!ids.length) return 'Vui lòng chọn ít nhất 1 lớp.';
    for(const cid of ids){ const n=Number(d.class_attendance[cid]); const cname=classObj(cid).class_name || cid; if(!Number.isFinite(n)||n<=0) return `Vui lòng nhập sĩ số của lớp ${cname}.`; }
    if(d.report_type==='REG' && !d.attendance_photo_b64) return 'Vui lòng chụp/chọn ảnh minh chứng sĩ số hoặc lớp học.';
    if(d.report_type==='EOM' && d.monthly_photos.filter(x=>x.img).length===0) return 'Vui lòng bổ sung ít nhất 1 ảnh minh chứng cuối tháng.';
    return '';
  }

  function buildPayload(){
    const d=state.data, t=teacher(), s=school(), l=lesson();
    const classes = selectedClassIds().map(cid=>({ class_id:cid, class_name:classObj(cid).class_name || cid, attendance_count:Number(d.class_attendance[cid])||0 }));
    const childObj = (id) => { const c=state.config.enrollment.find(x=>x.child_id===id)||{}; return {child_id:id,enrollment_id:c.enrollment_id||'',child_name:c.child_name||id,class_id:c.class_id||'',class_name:c.class_name||''}; };
    return {
      app_version: APP_VERSION, action:'submit_report_v2', created_client_at:new Date().toISOString(),
      tenant_id:currentTenantId(), school_year_id:currentSchoolYearId(),
      teacher_id:d.teacher_id, teacher_name:t.teacher_name||'', school_id:d.school_id, school_name:s.school_name||'', session_date:d.session_date,
      lesson_id:d.lesson_id, lesson_code:l.lesson_code||'', lesson_name:l.lesson_name||'', report_type:d.report_type, session_type:d.report_type === 'EOM' ? 'END_OF_MONTH' : 'REGULAR',
      classes, total_attendance:totalAttendance(), checklist:CHECKLIST.map((x,i)=>({item:x,checked:!!d.checklist[i]})),
      criteria:CRITERIA.map((x,i)=>({item:x,value:d.criteria[i]})), incident_status:d.incident_status, incident_desc:d.incident_desc,
      attendance_photo_b64:d.attendance_photo_b64, activity_photo_b64:"", memory_photo_b64:"", monthly_photos:d.monthly_photos,
      highlight:d.highlight, needs_attention:d.child_note_text || '', teacher_comment:d.teacher_comment, next_plan:d.next_plan,
      outstanding_children:d.outstanding_children.map(childObj), attention_children:d.attention_children.map(childObj),
      memory:null
    };
  }

  function applyConfig(json){
    state.config.teachers = (json.teachers || []).map(t=>Object.assign({},t,{teacher_name:displayTeacherName(t.teacher_name,t.teacher_id)}));
    state.config.schools = json.schools || [];

    state.config.lessons = json.lessons || [];
    // Không tải toàn bộ danh sách trẻ khi mở app; chỉ tải theo lớp được chọn để tăng tốc.
    if(json.enrollment) state.config.enrollment = json.enrollment || [];
  }
  function loadConfigFromCache(){
    try{
      const raw = localStorage.getItem(CONFIG_CACHE_KEY);
      if(!raw) return false;
      const cached = JSON.parse(raw);
      if(!cached || !cached.saved_at || (Date.now() - cached.saved_at > CONFIG_CACHE_TTL_MS)) return false;
      applyConfig(cached.data || {});
      state.configError = 'Đang dùng danh mục đã lưu trên máy để mở nhanh; hệ thống sẽ tự cập nhật nền.';
      return true;
    } catch(e){ return false; }
  }
  function saveConfigToCache(data){
    try{ localStorage.setItem(CONFIG_CACHE_KEY, JSON.stringify({saved_at:Date.now(), data:data})); } catch(e){}
  }
  function loadEnrollmentFromCache(key){
    try{
      const raw = localStorage.getItem(ENROLLMENT_CACHE_PREFIX + key);
      if(!raw) return null;
      const cached = JSON.parse(raw);
      if(!cached || !cached.saved_at || (Date.now() - cached.saved_at > CONFIG_CACHE_TTL_MS)) return null;
      return cached.data || [];
    } catch(e){ return null; }
  }
  function saveEnrollmentToCache(key, rows){
    try{ localStorage.setItem(ENROLLMENT_CACHE_PREFIX + key, JSON.stringify({saved_at:Date.now(), data:rows || []})); } catch(e){}
  }
  async function fetchEnrollmentForSelectedClasses(){
    const ids = selectedClassIds();
    if(!ids.length || !WEB_APP_URL || WEB_APP_URL.includes('PASTE_GOOGLE_APPS_SCRIPT')) return;
    const key = selectedClassKey();
    const cached = loadEnrollmentFromCache(key);
    if(cached){ state.config.enrollment = cached; state.enrollmentError=''; render(); return; }
    state.enrollmentLoading = true; state.enrollmentError=''; render();
    try{
      const url = WEB_APP_URL + '?action=enrollment&class_ids=' + encodeURIComponent(ids.join(',')) + '&tenant_id=' + encodeURIComponent(currentTenantId()) + '&school_year_id=' + encodeURIComponent(currentSchoolYearId());
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 7000);
      const res = await fetch(url, { signal: controller.signal });
      clearTimeout(timer);
      const json = await res.json();
      if(json.status !== 'success') throw new Error(json.message || 'Không tải được danh sách trẻ theo lớp');
      state.config.enrollment = json.enrollment || [];
      saveEnrollmentToCache(key, state.config.enrollment);
    } catch(err){
      state.enrollmentError = String((err && err.name === 'AbortError') ? 'Tải danh sách trẻ quá lâu. Có thể tiếp tục báo cáo, nhưng chưa chọn được trẻ.' : (err.message || err));
    } finally { state.enrollmentLoading=false; render(); }
  }

  async function loadConfig(){
    const hadCache = loadConfigFromCache();
    state.configLoading = !hadCache;
    render();
    try{
      if(!WEB_APP_URL || WEB_APP_URL.includes('PASTE_GOOGLE_APPS_SCRIPT')) throw new Error('Chưa dán WEB_APP_URL. Đang dùng dữ liệu demo.');
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 9000);
      const res = await fetch(WEB_APP_URL + '?action=config&tenant_id=' + encodeURIComponent(currentTenantId()) + '&school_year_id=' + encodeURIComponent(currentSchoolYearId()) + '&v=' + Date.now(), { signal: controller.signal });
      clearTimeout(timer);
      const text = await res.text();
      let json;
      try { json = JSON.parse(text); }
      catch(parseErr) { throw new Error('Apps Script không trả về JSON hợp lệ. Kiểm tra deploy Web App và quyền truy cập.'); }
      if(json.status !== 'success') throw new Error(json.message || 'Không tải được danh mục');
      const cfg = {teachers:json.teachers||[], schools:json.schools||[], classes:json.classes||[], lessons:json.lessons||[]};
      applyConfig(cfg);
      syncReportTeacherFromAuth();
      saveConfigToCache(cfg);
      state.configError = '';
      if(selectedClassIds().length) fetchEnrollmentForSelectedClasses();
    } catch(err){
      if(!hadCache){
        state.config = DEMO_CONFIG;
        state.configError = String((err && err.name === 'AbortError') ? 'Tải danh mục quá lâu. App đang dùng dữ liệu demo để tránh trắng màn hình.' : (err.message || err));
      } else {
        state.configError = 'Không cập nhật được danh mục mới, tạm dùng danh mục đã lưu trên máy. Chi tiết: ' + String((err && err.message) || err);
      }
    }
    finally{ state.configLoading=false; render(); }
  }

  async function bootstrapHub(){
    if(!state.auth.token) return;
    await syncHubProfile();
    render();
  }

  loadLocal();
  render();
  loadConfig();
  bootstrapHub();
})();
</script>
</body>
</html>
